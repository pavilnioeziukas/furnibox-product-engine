name: Reform approval workflow
on:
  pull_request:
    branches: [feature/reform-portal]
permissions:
  contents: read
jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest -v test_reform_shared.py test_reform_sync.py test_reform_pivot.py test_reform_approval_workflow.py test_reform_versions.py

