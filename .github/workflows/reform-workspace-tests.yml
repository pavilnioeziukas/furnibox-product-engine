name: Reform workspace
on:
  pull_request:
    paths:
      - 'webapp/**'
      - 'test_reform_workspace.py'
      - 'test_webapp.py'
      - '.github/workflows/reform-workspace-tests.yml'
jobs:
  reform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest -q test_reform_workspace.py test_webapp.py
