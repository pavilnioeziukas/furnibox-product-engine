name: Pricing Control Regression

on:
  push:
    branches:
      - feature/shelf-pp-transformation
    paths:
      - pricing_control.py
      - test_pricing_control.py
      - refresh_reform_pricing.py
      - .github/workflows/pricing-control-tests.yml
  pull_request:
    paths:
      - pricing_control.py
      - test_pricing_control.py
      - refresh_reform_pricing.py
      - approved_bom_replay.py
      - reform_input_acceptance.py
      - reform_so_line_prices.py
      - test_approved_bom_replay.py
      - test_reform_input_acceptance.py
      - test_refresh_reform_pricing.py
      - test_reform_so_line_prices.py
      - manifest/approved_reform_bom_expectations.json
      - .github/workflows/pricing-control-tests.yml

jobs:
  test-pricing-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest openpyxl
      - name: Run pricing control tests
        run: python -m pytest -q test_pricing_control.py

  test-reform-input-and-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependencies
        run: python -m pip install pytest openpyxl lxml python-dotenv
      - name: Check approved BOM replay, conflicts and price isolation
        run: >-
          python -m pytest -q
          test_approved_bom_replay.py
          test_reform_input_acceptance.py
          test_refresh_reform_pricing.py
          test_reform_so_line_prices.py
