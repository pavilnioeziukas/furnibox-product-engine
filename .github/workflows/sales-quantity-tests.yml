name: Sales quantity report
on:
  push:
    branches: [feat/sales-quantity-report, feature/shelf-pp-transformation]
  pull_request:
    paths:
      - sales_quantity_report.py
      - webapp/sales_quantities.py
      - webapp/reports.py
      - webapp/templates/reports.html
      - webapp/templates/base.html
      - webapp/templates/sales_quantities.html
      - test_sales_quantity_report.py
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest tzdata
      - run: python -m pytest test_sales_quantity_report.py test_webapp.py -q
