<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reform · Choose password</title><link rel="stylesheet" href="{{ url_for('static', filename='reform.css') }}"></head>
<body><main class="login-card"><div class="eyebrow">FURNIBOX / PRODUCT ENGINE</div><h1>Choose a new password</h1>
{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}
{% if valid %}<p>Use at least 12 characters.</p><form method="post"><input type="hidden" name="csrf" value="{{ session.reform_csrf }}"><label>New password<input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button>Save new password</button></form>
{% else %}<p role="alert" class="notice">This reset link is invalid or has expired.</p><p><a href="{{ url_for('reform.forgot_password') }}">Request a new reset link</a></p>{% endif %}
<p><a href="{{ url_for('reform.login') }}">Back to sign in</a></p></main></body></html>
